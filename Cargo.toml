[workspace]
resolver = "2"
members = [
    "crates/caligo-model",
    "crates/caligo-bridge",
    "crates/caligo-core",
    "crates/caligo-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
caligo-model = { path = "crates/caligo-model" }
caligo-core = { path = "crates/caligo-core" }
caligo-bridge = { path = "crates/caligo-bridge" }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
