[package]
name = "caligo-bridge"
version.workspace = true
edition.workspace = true

[lib]
# rlib:供 CLI/测试以普通依赖引用常量与纯函数;
# cdylib:实际被 loader 注入宿主进程的动态库产物。
crate-type = ["cdylib", "rlib"]

[features]
# K4-D0:研究路线默认关闭。`--features research` 仅用于自建宿主离线研究,
# 不构成 QQ 现场准入(见 docs/research/k4-execution-scope.md)。
default = []
research = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
windows-sys = { workspace = true }
