[package]
name = "caligo-core"
version.workspace = true
edition.workspace = true

[features]
# K4-D7b:转发 research 到 bridge;LAB 集成测试以本特性门控。
research = ["caligo-bridge/research"]

[dependencies]
caligo-model = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
caligo-bridge = { workspace = true }
windows-sys = { workspace = true }
sha2 = { workspace = true }
iced-x86 = { version = "1.21.0", features = ["decoder"] }

[[bin]]
name = "onebotd"
path = "src/bin/onebotd.rs"
