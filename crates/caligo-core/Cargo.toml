[package]
name = "caligo-core"
version.workspace = true
edition.workspace = true

[features]
# K4-D7b:转发 research 到 bridge;LAB 集成测试以本特性门控。
research = ["caligo-bridge/research"]

[dependencies]
caligo-model = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
caligo-bridge = { workspace = true }
windows-sys = { workspace = true }
sha2 = { workspace = true }
iced-x86 = { version = "1.21.0", features = ["decoder"] }
hmac = "=0.12.1"
sha1 = "=0.10.6"
tungstenite = { version = "=0.27.0", features = ["rustls-tls-native-roots", "url"] }
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
url = "=2.5.8"

[[bin]]
name = "onebotd"
path = "src/bin/onebotd.rs"
